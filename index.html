<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Archery Challenge</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <h1>Archery Challenge</h1>

        <nav>

            <a href="#target">Go to Target</a>

        </nav>

    </header>


    <main>

        <section id="target">

            <h2>Aim for the Bullseye</h2>

            <p>Try to hit the center of the target!</p>


            <div class="target-area">

                <div class="arrow">

                    <div class="arrow-head"></div>

                </div>

                <img
                    src="./Images/target.png"
                    alt="Archery target"
                >

            </div>


            <div id="Hit_Total">

                <p id="hit1">
                    Hit 1: 0
                </p>

                <p id="hit2">
                    Hit 2: 0
                </p>

                <p id="hit3">
                    Hit 3: 0
                </p>

            </div>


            <div class="power-meter">

                <div class="power-fill"></div>

            </div>

            <button
                id="shoot-button"
                type="button"
            >
                Hold to Aim
            </button>
            <br>
            <br>
            <button
                id="reset-shots-button"
                type="button">
                Reset Shots
            </button>


            <p id="score">

                Score: 0

            </p>


            <p id="highscore">

                High Score: 0

            </p>


            <!-- **************************
                 RESET BUTTONS HIGHSCORE
            *************************** -->

            <button
                id="reset-highscore-button"
                type="button"
            >
                Reset High Score
            </button>

        </section>

    </main>


    <footer>

        <p>

            Tip: Hold the button down to increase the power.

        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
