<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Archery Challenge</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Archery Challenge</h1>

        <nav>
            <a href="#target">Go to Target</a>
        </nav>
    </header>


    <main>

        <section id="target">

            <h2>Aim for the Bullseye</h2>

            <p>Try to hit the center of the target!</p>


            <div class="target-area">

                <div class="arrow">
                    <div class="arrow-head"></div>
                </div>

                <img src="./Images/target.png" alt="Archery target">

            </div>


            <div class="power-meter">
                <div class="power-fill"></div>
            </div>

            <button id="shoot-button" type="button">
                Hold to Aim
            </button>

            <p id="score">Score: 0</p>

        </section>

    </main>


    <footer>
        <p>Tip: Hold the button down to increase the power.</p>
    </footer>


    <script src="script.js"></script>

</body>

</html>
